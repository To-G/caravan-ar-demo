<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>魔法集市 · AR 贺卡</title>
<style>
  :root{--ink:#253064;--coral:#F2685A;--cream:#FFF4E2;--gold:#F6B53C}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none}
  #ar{position:fixed;inset:0}
  .hidden{display:none!important}
  .overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center}
  #start{background:var(--cream);color:var(--ink)}
  #start h1{margin:0;font-size:30px;letter-spacing:1px}
  #start p{margin:0;font-size:16px;line-height:1.7;color:#4a5383;max-width:320px}
  .btn{appearance:none;border:0;border-radius:999px;background:var(--coral);color:#fff;font-size:20px;font-weight:800;padding:16px 44px;box-shadow:0 6px 0 #c94b3f;font-family:inherit}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #c94b3f}
  .link{background:none;border:0;color:#4a5383;font-size:15px;text-decoration:underline;font-family:inherit}
  .tip{font-size:13px;color:#8a90b0;max-width:320px;line-height:1.6}
  #scanning{pointer-events:none;z-index:10;justify-content:flex-end;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  #scanning .frame{position:absolute;left:50%;top:44%;width:66vmin;height:66vmin;transform:translate(-50%,-50%);border-radius:18px;
    background:linear-gradient(var(--gold),var(--gold)) left top/34px 6px no-repeat,linear-gradient(var(--gold),var(--gold)) left top/6px 34px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right top/34px 6px no-repeat,linear-gradient(var(--gold),var(--gold)) right top/6px 34px no-repeat,
    linear-gradient(var(--gold),var(--gold)) left bottom/34px 6px no-repeat,linear-gradient(var(--gold),var(--gold)) left bottom/6px 34px no-repeat,
    linear-gradient(var(--gold),var(--gold)) right bottom/34px 6px no-repeat,linear-gradient(var(--gold),var(--gold)) right bottom/6px 34px no-repeat;
    animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.04)}}
  .pill{background:rgba(37,48,100,.82);color:#fff;font-size:17px;font-weight:700;padding:12px 22px;border-radius:999px}
  #loading{background:var(--cream);color:var(--ink);font-size:18px;font-weight:700;z-index:15}
  #hud{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));z-index:12;display:flex;justify-content:center;gap:12px;pointer-events:none}
  #hud .btn{pointer-events:auto;font-size:17px;padding:12px 28px}
  #replay:disabled{opacity:.55}
  #orbit,#orbit-tip{position:fixed;top:calc(16px + env(safe-area-inset-top));left:16px;z-index:12;font-size:14px}
  #orbit{padding:10px 14px;border-radius:999px;background:var(--cream);color:var(--ink);font-weight:800;text-decoration:none}
  #orbit-tip{top:calc(66px + env(safe-area-inset-top));pointer-events:none}
  #ar canvas.orbit-view{touch-action:none;cursor:grab}
  #ar canvas.orbit-view:active{cursor:grabbing}
  #coins{position:fixed;top:calc(16px + env(safe-area-inset-top));right:16px;z-index:12;background:rgba(255,244,226,.94);color:var(--ink);font-weight:800;font-size:18px;padding:8px 16px;border-radius:999px;border:3px solid var(--ink)}
  #err{background:var(--cream);color:var(--ink)}
  #desk{background:#2B2F45;color:#fff;flex-direction:row;gap:48px}
  #desk img{height:min(88vh,1000px);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  #desk .side{max-width:320px;text-align:left;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
  #desk h2{margin:0;font-size:28px} #desk p{margin:0;font-size:17px;line-height:1.8;color:#d5d8ec}
  #desk .link{color:#d5d8ec;padding:0}
  @media (max-width:800px){#desk{flex-direction:column}#desk img{height:auto;width:min(90vw,420px)}}
</style>
<script type="importmap">
{ "imports": {
  "three": "./lib/three.module.js",
  "three/addons/": "./lib/addons/"
} }
</script>
</head>
<body>
<div id="ar"></div>

<div id="start" class="overlay hidden">
  <h1>魔法集市 · 寻宝记</h1>
  <p>点一下按钮打开摄像头，<br>再把手机对准贺卡上的<b>地图</b></p>
  <button class="btn" id="go">打开摄像头</button>
  <button class="link" id="preview">没有贺卡？直接看预览</button>
  <div class="tip">如果打不开摄像头：请点右上角「…」选择「在浏览器中打开」</div>
</div>
<div id="desk" class="overlay hidden">
  <img id="desk-card" alt="AR 贺卡">
  <div class="side">
    <h2>用手机扫一扫</h2>
    <p>① 手机扫贺卡右下角的二维码<br>② 允许打开摄像头<br>③ 先让完整地图进入镜头，再慢慢变换角度</p>
    <button class="link" id="desk-preview">打开 360° 预览</button>
  </div>
</div>
<div id="loading" class="overlay hidden">正在准备魔法…</div>
<div id="scanning" class="overlay hidden"><div class="frame"></div><div class="pill" id="scan-tip">把完整地图放进镜头</div></div>
<div id="err" class="overlay hidden">
  <h2 style="margin:0">摄像头没有打开</h2>
  <p class="tip" style="font-size:15px">请允许使用摄像头后刷新；在微信里打不开时，点右上角「…」→「在浏览器中打开」。</p>
  <button class="btn" id="err-preview">先看预览</button>
</div>
<div id="coins" class="hidden">🪙 0</div>
<a id="orbit" class="hidden" href="?preview">360° 预览</a>
<div id="orbit-tip" class="pill hidden">拖动画面，绕着地图看</div>
<div id="hud" class="hidden"><button class="btn" id="replay">再看一次</button></div>

<script type="module" src="./app.js"></script>
</body>
</html>
